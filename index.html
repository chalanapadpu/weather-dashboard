<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">
        <header>
            <h1>☁️ Weather Dashboard</h1>
            <p>Discover the weather in any city</p>
        </header>

        <form id="search-form">
            <label for="city-input">Enter city name</label>
            <div class="search-box">
                <input type="text" id="city-input" placeholder="e.g. Mangalore" required>
                <button type="submit" id="search-btn">Search</button>
            </div>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <section id="weather-card" class="weather-card" hidden>
            <h2 id="city-name"></h2>
            <img id="weather-icon" src="" alt="Weather icon">
            <h3 id="temperature"></h3>
            <p id="description"></p>

            <div class="metrics">
                <article class="metric">
                    <span>💧 Humidity</span>
                    <strong id="humidity"></strong>
                </article>
                <article class="metric">
                    <span>💨 Wind Speed</span>
                    <strong id="wind"></strong>
                </article>
                <article class="metric">
                    <span>🌡️ Feels Like</span>
                    <strong id="feels-like"></strong>
                </article>
            </div>
        </section>

        <footer>
            Weather data powered by OpenWeather
        </footer>
    </main>
</body>

</html>
